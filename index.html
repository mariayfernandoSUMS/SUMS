<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SUMS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e100f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>SUMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0; --card: #ffffff; --ink: #15181c; --muted: #8b9098; --line: #eceae4;
    --verde: #2b9a5d; --verde-osc: #0c2a1c; --verde-osc2: #164a30; --verde-suave: #e2f2e8; --verde-pill: #e6f4ea;
    --ingreso: #2b9a5d; --reemb: #3b78d8; --traspaso: #8a63d2; --naranja: 245, 150, 95;
    --ico-tr: #eceef0; --ico-re: #e3ecfb; --ico-in: #e3f3e8; --linea: #3c9467;
    --sombra: 0 1px 2px rgba(20, 24, 28, .04), 0 6px 20px rgba(20, 24, 28, .05);
    --r: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .oculto { display: none !important; }
  main { max-width: 520px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px 130px; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  /* Cabecera */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 2px 6px; }
  .top h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .top p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .top.principal { height: 74px; padding: 10px 2px 0; }
  .top.principal > div:first-child { flex: 1; min-width: 0; }
  .top.principal h1 { line-height: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; }
  .top.principal p { line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top.principal + .mes { margin-top: 8px; }
  .tit-det { display: flex; gap: 10px; align-items: flex-start; }
  .tit-det > div { min-width: 0; flex: 1; }
  .tit-det .ibtn { margin-top: -2px; }
  .acciones { display: flex; gap: 6px; padding-top: 2px; }
  .ibtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--sombra); }
  .ibtn svg { width: 20px; height: 20px; }

  /* Selector de mes */
  .mes { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 14px;
    background: var(--card); border-radius: 16px; padding: 6px; box-shadow: var(--sombra); }
  .mes b { font-size: 17px; font-weight: 700; padding: 6px 10px; border-radius: 10px; }
  .mes b.pulsado { background: var(--bg); }
  .mes button { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
  .mes button.pulsado { background: var(--bg); }
  .mes svg { width: 18px; height: 18px; }
  .mes-fija { position: sticky; top: calc(env(safe-area-inset-top) + 8px); z-index: 15; }
  .mes-fija.pegada { box-shadow: 0 6px 20px rgba(20, 24, 28, .14); }
  .mes-fija.pegada::before { content: ''; position: absolute; left: -16px; right: -16px; top: calc(-8px - env(safe-area-inset-top)); height: calc(8px + env(safe-area-inset-top));
    background: var(--bg); pointer-events: none; }

  /* Bloque balance (oscuro) */
  .balance { --b-ink: var(--ink); --b-sub: #8a857a; --b-cristal: rgba(255,255,255,.65); --b-barra: #c9c4b8; --b-barra-hoy: #6f695e;
    --b-in: #2a7a4b; --b-ga: #b8434a; --b-aho: #3d48a8; --b-neg: #b8434a; --c-ing: #e2f5e9; --c-gas: #fde6e6;
    background: #ebe9e3; color: var(--b-ink); border-radius: 26px; padding: 20px 20px 16px; box-shadow: none; }
  .balance .cab b { color: #7d776b; opacity: 1; }
  .balance .duo .caja-ing { background: var(--c-ing); } .balance .duo .caja-ing small { color: #4f8a66; }
  .balance .duo .caja-gas { background: var(--c-gas); } .balance .duo .caja-gas small { color: #b0656a; }
  .balance .cab { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--b-sub); font-weight: 600; }
  .balance .cab b { color: var(--b-ink); opacity: .8; font-weight: 600; }
  .balance .grande { font-size: 40px; font-weight: 800; letter-spacing: -.03em; margin: 2px 0 2px; line-height: 1.1; color: var(--b-aho); }
  .duo .ga { color: var(--b-ga); }
  .pct { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--b-cristal); color: var(--b-aho); }
  .pct.neg { color: var(--b-neg); }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 14px; }
  .duo div { background: var(--b-cristal); border-radius: 16px; padding: 10px 14px; }
  .duo small { display: block; font-size: 12px; color: var(--b-sub); font-weight: 600; }
  .duo b { font-size: 18px; font-weight: 700; }
  .duo .in { color: var(--b-in); }
  .barras { display: flex; align-items: flex-end; gap: 3px; height: 54px; }
  .barras i { flex: 1; border-radius: 3px; background: var(--b-barra); min-height: 4px; }
  .barras i.hoy { background: var(--b-barra-hoy); }
  .barras i.fut { background: var(--b-barra); opacity: .5; height: 4px !important; border-radius: 50%; }
  .ejes { display: flex; justify-content: space-between; font-size: 11px; color: var(--b-sub); margin-top: 6px; position: relative; height: 15px; }
  .ejes .h { position: absolute; transform: translateX(-50%); color: var(--b-ink); font-weight: 700; white-space: nowrap; }

  .ir-zona { cursor: pointer; transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .15s; }
  .ir-zona.pulsado { transform: scale(.97); opacity: .75; }
  i.ir { display: inline-block; width: 11px; height: 11px; vertical-align: -1px; opacity: .55; margin-left: 1px; }
  i.ir svg { width: 100%; height: 100%; display: block; }

  /* Tarjetas */
  .card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--sombra); margin-top: 14px; }
  .card-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .card-cab h3 { margin: 0; font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .vertodos { color: var(--ink); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 4px; }
  .vertodos svg { width: 16px; height: 16px; }
  .vacio { color: var(--muted); text-align: center; padding: 22px 0; font-size: 14px; }

  /* Fila de movimiento */
  .mov { display: flex; align-items: center; gap: 12px; padding: 9px 0; cursor: pointer; }
  .mov + .mov { border-top: 1px solid var(--line); }
  .ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; font-weight: 800; font-size: 15px; }
  .ico.emo { font-size: 23px; font-weight: 400; line-height: 1; background: none !important; }
  .emo-ley { margin-right: 6px; }
  .mov .txt { flex: 1; min-width: 0; }
  .mov .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mov .s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mov .imp { font-weight: 700; font-size: 14px; white-space: nowrap; text-align: right; }
  .mov .imp small { display: block; font-size: 11px; color: var(--reemb); font-weight: 600; }
  .mov .tachado { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .mov.previsto { opacity: .6; }
  .mov.previsto .ico { background: transparent !important; border: 1.5px dashed var(--muted); color: var(--muted) !important; }
  .imp.in { color: var(--ingreso); } .imp.re { color: var(--reemb); } .imp.tr { color: var(--traspaso); }

  /* Segmentos y recuadros */
  .seg { display: flex; background: #e7e5df; border-radius: 14px; padding: 4px; margin-top: 10px; }
  .seg button { flex: 1; padding: 9px; border-radius: 11px; font-weight: 600; color: var(--muted); font-size: 14px; }
  .seg-vista { margin: 0 0 12px; }
  .filtros { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
  .filtros::-webkit-scrollbar { display: none; }
  .filtros button { flex: none; padding: 7px 13px; border-radius: 99px; font-size: 13px; font-weight: 700; color: var(--muted); background: var(--card); box-shadow: var(--sombra); }
  .filtros button.on { background: var(--ink); color: var(--bg); }
  .fbanco { position: relative; flex: none; display: flex; align-items: center; gap: 4px; margin: 0; padding: 7px 11px 7px 13px; border-radius: 99px;
    font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--ink); background: var(--card); box-shadow: var(--sombra); }
  .fbanco.on { background: var(--ink); color: var(--bg); }
  .fbanco .flecha-sel { width: 12px; height: 12px; transform: rotate(90deg); opacity: .6; }
  .fbanco select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; padding: 0; border: 0; font-size: 16px; }
  .fsep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }
  .filtros button.pulsado { transform: scale(.93); }
  .filtros .on.f-gasto { background: #fde8e3; color: #ad4535; }
  .filtros .on.f-ingreso { background: #e4f4ea; color: #1f7444; }
  .filtros .on.f-reembolso { background: #e3ecfb; color: #2d64bd; }
  .filtros .on.f-traspaso { background: #eee6fb; color: #6b45b8; }
  :root[data-tema="oscuro"] .filtros .on.f-gasto { background: #3a1f1c; color: #f2a194; }
  :root[data-tema="oscuro"] .filtros .on.f-ingreso { background: #173323; color: #7fd9a0; }
  :root[data-tema="oscuro"] .filtros .on.f-reembolso { background: #1b2740; color: #9cc0ff; }
  :root[data-tema="oscuro"] .filtros .on.f-traspaso { background: #2a2140; color: #c9b4ff; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tres div { border-radius: 16px; padding: 10px 12px; min-width: 0; }
  .tres .ing { background: #e2f5e9; color: #2a7a4b; }
  .tres .tasa-m { display: block; font-style: normal; font-size: 11px; font-weight: 700; opacity: .75; margin-top: 1px; white-space: nowrap; }
  .tres .gas { background: #fde6e6; color: #b8434a; }
  .tres .aho { background: #e5e8fd; color: #3d48a8; }
  .tres small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; opacity: .75; text-transform: uppercase; }
  .tres b { font-size: 16px; font-weight: 700; white-space: nowrap; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--verde-pill); color: var(--verde); font-weight: 700;
    font-size: 13px; padding: 6px 10px 6px 12px; border-radius: 99px; margin-bottom: 10px; }

  /* Calendario (minimalista: círculos de color según el gasto variable y un punto si hay movimientos) */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; }
  .cal .dsem { text-align: center; font-size: 10px; font-weight: 600; color: var(--muted); opacity: .75; padding: 0 0 2px; }
  .dia { height: 37px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    font-weight: 600; font-size: 14px; position: relative; cursor: pointer; }
  .dia.fuera { visibility: hidden; }
  .dia::before { content: ''; position: absolute; top: 1px; left: 0; right: 0; margin: 0 auto; width: 29px; height: 29px; border-radius: 50%; background: var(--tono, transparent); z-index: 0; }
  .dia > * { position: relative; z-index: 1; }
  .dia .n { height: 31px; display: grid; place-items: center; font-size: 13px; }
  .dia.futuro { color: #b6b9be; }
  .dia.hoy .n { color: var(--verde); font-weight: 800; }
  .dia.sel::after { content: ''; position: absolute; top: 1px; left: 0; right: 0; margin: 0 auto; width: 29px; height: 29px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink); z-index: 2; pointer-events: none; }
  .puntos { display: flex; gap: 2px; margin-top: 0; align-items: center; height: 4px; }
  .puntos i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); opacity: .55; }
  .puntos i.prev { background: transparent; border: 1px solid var(--muted); width: 5px; height: 5px; }
  .cal-card { padding: 8px 8px 6px; margin-top: 10px; }
  .leyenda { text-align: center; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .dia-cab { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 4px 0; }
  .dia-cab h4 { margin: 0; font-size: 16px; font-weight: 700; }
  .dia-cab span { color: var(--muted); font-weight: 600; font-size: 14px; }
  .grupo { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin: 16px 0 2px; }
  .grupo:first-child { margin-top: 4px; }
  .buscar { display: flex; gap: 8px; align-items: center; background: var(--card); border-radius: 14px; padding: 4px 4px 4px 12px; box-shadow: var(--sombra); margin-top: 10px; }
  .buscar input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 16px; background: none; padding: 8px 0; }

  /* Patrimonio */
  .patri { background: #ebe9e3; border-radius: 26px; padding: 14px 14px 0; overflow: hidden; margin-top: 10px; }
  .mes + .patri { margin-top: 0; }
  :root[data-tema="oscuro"] .patri:not(.prevg) { background: #1d1f1e; }
  .mes.periodos { justify-content: space-between; gap: 2px; padding: 6px 8px; }
  .mes.periodos button { width: auto; height: 38px; padding: 0 10px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .mes.periodos button.on { background: var(--bg); color: var(--ink); }
  .mes.periodos .ojo { padding: 0 6px; color: var(--muted); }
  .periodos .ojo svg { width: 20px; height: 20px; display: block; }
  .patri .lbl { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #5d6b63; margin-top: 14px; }
  .patri .grande { text-align: center; font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
  .patri .var { text-align: center; font-size: 14px; font-weight: 700; color: var(--verde); margin-top: 2px; }
  .patri .var.baja { color: #c4581b; }
  .grafico { position: relative; margin: 10px -14px 0; touch-action: pan-y; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  .patri svg.linea { display: block; width: 100%; height: 130px; }
  .grafico .cursor { position: absolute; top: 4px; bottom: 0; width: 1.5px; margin-left: -.75px; background: rgba(20, 83, 47, .45); opacity: 0; pointer-events: none; }
  .patri svg .trazo { stroke: var(--linea); } .patri:not(.prevg) svg circle { fill: var(--linea); }
  .grafico .punto { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--linea); border: 3px solid var(--card);
    box-shadow: 0 2px 8px rgba(20, 83, 47, .35); transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
  .grafico.activo .cursor, .grafico.activo .punto { opacity: 1; }
  .grafico.activo svg circle { visibility: hidden; }
  .patri .var.fecha { color: #3f5247; }
  .patri .pgrid { stroke: var(--linea); stroke-opacity: .16; stroke-width: 1; stroke-dasharray: 2 4; vector-effect: non-scaling-stroke; }
  .patri .peje { position: absolute; right: 10px; transform: translateY(-115%); font-size: 10px; font-weight: 600; color: var(--linea); opacity: .6;
    font-variant-numeric: tabular-nums; pointer-events: none; }
  .pfechas { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; color: var(--linea); opacity: .6; padding: 4px 0 10px; }

  /* Respuesta visual al pulsar */
  button, .mov, .dia, .cuenta .txt, .cuenta .imp, .mes b { transition: transform .18s cubic-bezier(.34,1.56,.64,1), background-color .15s, opacity .15s; }
  .ibtn.pulsado, .mes button.pulsado, .btn.pulsado, .chip.pulsado, .opcion.pulsado, .vertodos.pulsado, .periodos button.pulsado, .aviso-sb.pulsado { transform: scale(.93); }
  .seg button.pulsado, .temas button.pulsado { transform: scale(.95); }
  .ibtn.pulsado { background: #ecebe6; }
  .btn.pri.pulsado { background: #3f9e6a; }
  .btn.sec.pulsado, .opcion.pulsado { background: #e6e4de; }
  .mov.pulsado { background: #f4f3ef; border-radius: 14px; transform: scale(.985); }
  .dia.pulsado { transform: scale(.9); }
  .cuenta .txt.pulsado, .cuenta .imp.pulsado { opacity: .6; }
  .mes b.pulsado { transform: scale(.95); }
  .cuenta { display: flex; align-items: center; gap: 12px; padding: 12px 0; background: var(--card); }
  .cuenta + .cuenta { border-top: 1px solid var(--line); }
  .cuenta .logo { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; overflow: hidden;
    color: #fff; font-weight: 800; font-size: 18px; }
  .cuenta .logo img { width: 100%; height: 100%; object-fit: contain; background: transparent; }
  .cuenta .txt { flex: 1; min-width: 0; cursor: pointer; }
  .cuenta .t { font-weight: 700; }
  .cuenta .s { color: var(--muted); font-size: 13px; }
  .cuenta .imp { font-weight: 700; cursor: pointer; }
  .asa { width: 34px; height: 40px; display: grid; place-items: center; color: #b4b7bc; touch-action: none; cursor: grab; }
  .asa svg { width: 20px; height: 20px; }
  .cuenta.arrastrando { position: relative; z-index: 3; box-shadow: 0 8px 24px rgba(0,0,0,.12); border-radius: 14px; }

  /* Barra inferior */
  /* Efecto cristal (inspirado en Liquid Glass): fondo translúcido, desenfoque y brillos en los bordes */
  .barra { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(2px, calc(env(safe-area-inset-bottom) - 3px)); z-index: 20;
    display: flex; align-items: center; gap: 4px; border-radius: 99px; padding: 6px; width: min(calc(100% - 28px), 420px); justify-content: space-between;
    background: linear-gradient(180deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,.16) 100%);
    backdrop-filter: blur(5px) saturate(170%); -webkit-backdrop-filter: blur(5px) saturate(170%);
    border: 1px solid rgba(255,255,255,.6);
    box-shadow: 0 10px 30px rgba(20, 24, 28, .12), 0 1px 4px rgba(20, 24, 28, .05), inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 2px rgba(255,255,255,.35); }
  .tab { position: relative; z-index: 1; height: 48px; width: 60px; border-radius: 99px; display: flex; align-items: center; justify-content: center; color: #6f747b;
    transition: color .3s, transform .25s cubic-bezier(.34,1.56,.64,1); }
  .tab svg { width: 22px; height: 22px; flex: none; }
  .tab span { display: none; }
  .tab.pulsado { transform: scale(.86); }
  .tab.on { color: var(--verde); }
  .tab.on svg { transform: scale(1.08); transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
  .lente { position: absolute; top: 6px; height: 48px; width: 60px; border-radius: 99px; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.55), rgba(255,255,255,.12) 55%, rgba(255,255,255,.04));
    -webkit-backdrop-filter: blur(1.5px) saturate(1.8) brightness(1.06); backdrop-filter: blur(1.5px) saturate(1.8) brightness(1.06);
    box-shadow: inset 0 1.5px 1px rgba(255,255,255,.95), inset 0 -1.5px 2px rgba(255,255,255,.55), inset 0 0 0 .5px rgba(255,255,255,.7),
      inset 0 -6px 10px rgba(0,0,0,.03), 0 3px 10px rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.07);
    transition: left .5s cubic-bezier(.34,1.45,.55,1), transform .5s cubic-bezier(.34,1.45,.55,1); }
  .lente.estira { transform: scaleX(1.18) scaleY(.92); }
  .mas { position: relative; z-index: 1; width: 56px; height: 56px; border-radius: 50%; color: #fff; display: grid; place-items: center; flex: none; margin: -6px 0;
    background: #4fb57e; box-shadow: 0 6px 16px rgba(60, 160, 105, .32);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  .mas.pulsado { transform: scale(.88) rotate(90deg); }

const esFijo = m => FIJOS.has([m.categoria, m.subcategoria, m.detalle].join('|')) ||

const SIN_BANCO = 'Sin banco';
const delMes = (arr, d) => arr.filter(m => m.fecha.slice(0, 7) === claveMes(d));
function resumen(arr) {
  let ing = 0, gas = 0, ree = 0;
  arr.forEach(m => { if (m.tipo === 'Ingreso') ing += m.importe; else if (m.tipo === 'Gasto') gas += m.importe; else if (m.tipo === 'Reembolso') ree += m.importe; });
  const g = gas - ree;
  return { ing, gas: g, ahorro: ing - g, pct: ing > 0 ? (ing - g) / ing * 100 : null };
}
// Gasto variable neto por día (gastos variables − reembolsos de categorías variables)
function variablePorDia(arr) {

}
const reembolsosDe = id => D.movs.filter(m => m.tipo === 'Reembolso' && m.vinculado === id);

function colorCat(cat) {

// Emoji de la hoja Categorías (columna Icono): primero el del detalle, luego subcategoría y luego categoría.
// Con «exacto» solo devuelve el propio de ese nivel (para no repetir el de la categoría en todas las opciones del formulario).
function emojiDe(cat, sub, det, exacto) {
  const I = (D.config && D.config.iconos) || {};
  cat = cat || ''; sub = sub || ''; det = det || '';
  if (exacto) return I[`${cat}|${sub}|${det}`] || '';

}
function icono(m) {

  if (m.tipo === 'Reembolso') return `<div class="ico emo">${emojiDe(m.categoria, m.subcategoria, m.detalle) || '↩️'}</div>`;
  const e = emojiDe(m.categoria, m.subcategoria, m.detalle);

  const c = colorCat(m.categoria);

function filaMov(m, conFecha) {
  const etiqueta = m.tipo === 'Traspaso' ? `${m.metodo} → ${m.destino}` : (m.detalle || m.subcategoria || m.categoria);
  const sub = [m.pendiente ? '⏳ Pendiente' : '', etiqueta, conFecha ? fechaCorta(m.fecha) : (m.previsto ? 'Previsto' : '')].filter(Boolean).join(' · ');
  let imp;

function contar(raiz) {

// Curva suave que pasa por todos los puntos sin pasarse por encima ni por debajo (interpolación monótona)
function curvaSuave(p) {
  const n = p.length;
  if (n < 3) return p.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1][0] - p[i][0]; m[i] = (p[i + 1][1] - p[i][1]) / (dx[i] || 1); }

    const a = t[i] / m[i], b = t[i + 1] / m[i], h = a * a + b * b;
    if (h > 9) { const k = 3 / Math.sqrt(h); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = 'M' + p[0][0].toFixed(1) + ' ' + p[0][1].toFixed(1);
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += ` C${(p[i][0] + h).toFixed(1)} ${(p[i][1] + t[i] * h).toFixed(1)} ${(p[i + 1][0] - h).toFixed(1)} ${(p[i + 1][1] - t[i + 1] * h).toFixed(1)} ${p[i + 1][0].toFixed(1)} ${p[i + 1][1].toFixed(1)}`;

}

// Reordenar cuentas arrastrando las tres rayitas
function activarArrastre() {
  const cont = $('#cuentas'); if (!cont) return;
  cont.querySelectorAll('.asa').forEach(asa => {
    asa.addEventListener('pointerdown', e => {
      e.preventDefault();
      const fila = asa.closest('.cuenta'); fila.classList.add('arrastrando');
      let y0 = e.clientY;
      asa.setPointerCapture(e.pointerId);
      const mover = ev => {
        const dy = ev.clientY - y0;
        fila.style.transform = `translateY(${dy}px)`;
        const sig = fila.nextElementSibling, ant = fila.previousElementSibling;
        if (sig && dy > sig.offsetHeight / 2) { cont.insertBefore(sig, fila); y0 += sig.offsetHeight; fila.style.transform = `translateY(${ev.clientY - y0}px)`; }
        else if (ant && -dy > ant.offsetHeight / 2) { cont.insertBefore(fila, ant); y0 -= ant.offsetHeight; fila.style.transform = `translateY(${ev.clientY - y0}px)`; }
      };
      const soltar = async () => {
        asa.removeEventListener('pointermove', mover); asa.removeEventListener('pointerup', soltar); asa.removeEventListener('pointercancel', soltar);
        fila.classList.remove('arrastrando'); fila.style.transform = '';
        const orden = [...cont.querySelectorAll('.cuenta')].map(x => x.dataset.banco);
        if (orden.join('|') === D.cuentas.map(c => c.banco).join('|')) return;
        D.cuentas.sort((a, b) => orden.indexOf(a.banco) - orden.indexOf(b.banco));
        try { await api('api_ordenCuentas', orden); toast('Orden guardado'); } catch (err) { toast(err.message); }
      };
      asa.addEventListener('pointermove', mover); asa.addEventListener('pointerup', soltar); asa.addEventListener('pointercancel', soltar);
    });
  });
}

    const ini = x.off + 30 + dv.getUint16(x.off + 26, true) + dv.getUint16(x.off + 28, true), datos = u8.slice(ini, ini + x.tam);

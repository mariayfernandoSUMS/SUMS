<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SUMS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e100f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>SUMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0; --card: #ffffff; --ink: #15181c; --muted: #8b9098; --line: #eceae4;
    --verde: #2b9a5d; --verde-osc: #0c2a1c; --verde-osc2: #164a30; --verde-suave: #e2f2e8; --verde-pill: #e6f4ea;
    --ingreso: #2b9a5d; --reemb: #3b78d8; --traspaso: #8a63d2; --naranja: 245, 150, 95;
    --ico-tr: #eceef0; --ico-re: #e3ecfb; --ico-in: #e3f3e8; --linea: #3c9467;
    --sombra: 0 1px 2px rgba(20, 24, 28, .04), 0 6px 20px rgba(20, 24, 28, .05);
    --r: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .oculto { display: none !important; }
  main { max-width: 520px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px 130px; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  /* Cabecera */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 2px 6px; }
  .top h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .top p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .top.principal { height: 74px; padding: 10px 2px 0; }
  .top.principal > div:first-child { flex: 1; min-width: 0; }
  .top.principal h1 { line-height: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; }
  .top.principal p { line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top.principal + .mes { margin-top: 8px; }
  .tit-det { display: flex; gap: 10px; align-items: flex-start; }
  .tit-det > div { min-width: 0; flex: 1; }
  .tit-det .ibtn { margin-top: -2px; }
  .acciones { display: flex; gap: 6px; padding-top: 2px; }
  .ibtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--sombra); }
  .ibtn svg { width: 20px; height: 20px; }

  /* Selector de mes */
  .mes { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 14px;
    background: var(--card); border-radius: 16px; padding: 6px; box-shadow: var(--sombra); }
  .mes b { font-size: 17px; font-weight: 700; padding: 6px 10px; border-radius: 10px; }
  .mes b.pulsado { background: var(--bg); }
  .mes button { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
  .mes button.pulsado { background: var(--bg); }
  .mes svg { width: 18px; height: 18px; }

  /* Bloque balance (oscuro) */
  .balance { --b-ink: var(--ink); --b-sub: #8a857a; --b-cristal: rgba(255,255,255,.65); --b-barra: #c9c4b8; --b-barra-hoy: #6f695e;
    --b-in: #2a7a4b; --b-ga: #b8434a; --b-aho: #3d48a8; --b-neg: #b8434a; --c-ing: #e2f5e9; --c-gas: #fde6e6;
    background: #ebe9e3; color: var(--b-ink); border-radius: 26px; padding: 20px 20px 16px; box-shadow: none; }
  .balance .cab b { color: #7d776b; opacity: 1; }
  .balance .duo .caja-ing { background: var(--c-ing); } .balance .duo .caja-ing small { color: #4f8a66; }
  .balance .duo .caja-gas { background: var(--c-gas); } .balance .duo .caja-gas small { color: #b0656a; }
  .balance .cab { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--b-sub); font-weight: 600; }
  .balance .cab b { color: var(--b-ink); opacity: .8; font-weight: 600; }
  .balance .grande { font-size: 40px; font-weight: 800; letter-spacing: -.03em; margin: 2px 0 2px; line-height: 1.1; color: var(--b-aho); }
  .duo .ga { color: var(--b-ga); }
  .pct { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--b-cristal); color: var(--b-aho); }
  .pct.neg { color: var(--b-neg); }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 14px; }
  .duo div { background: var(--b-cristal); border-radius: 16px; padding: 10px 14px; }
  .duo small { display: block; font-size: 12px; color: var(--b-sub); font-weight: 600; }
  .duo b { font-size: 18px; font-weight: 700; }
  .duo .in { color: var(--b-in); }
  .barras { display: flex; align-items: flex-end; gap: 3px; height: 54px; }
  .barras i { flex: 1; border-radius: 3px; background: var(--b-barra); min-height: 4px; }
  .barras i.hoy { background: var(--b-barra-hoy); }
  .barras i.fut { background: var(--b-barra); opacity: .5; height: 4px !important; border-radius: 50%; }
  .ejes { display: flex; justify-content: space-between; font-size: 11px; color: var(--b-sub); margin-top: 6px; position: relative; height: 15px; }
  .ejes .h { position: absolute; transform: translateX(-50%); color: var(--b-ink); font-weight: 700; white-space: nowrap; }

  .ir-zona { cursor: pointer; transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .15s; }
  .ir-zona.pulsado { transform: scale(.97); opacity: .75; }
  i.ir { display: inline-block; width: 11px; height: 11px; vertical-align: -1px; opacity: .55; margin-left: 1px; }
  i.ir svg { width: 100%; height: 100%; display: block; }

  /* Tarjetas */
  .card { background: var(--card); border-radius: var(--r); padding: 16px; box-shadow: var(--sombra); margin-top: 14px; }
  .card-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .card-cab h3 { margin: 0; font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .vertodos { color: var(--ink); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 4px; }
  .vertodos svg { width: 16px; height: 16px; }
  .vacio { color: var(--muted); text-align: center; padding: 22px 0; font-size: 14px; }

  /* Fila de movimiento */
  .mov { display: flex; align-items: center; gap: 12px; padding: 11px 0; cursor: pointer; }
  .mov + .mov { border-top: 1px solid var(--line); }
  .ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; font-weight: 800; font-size: 15px; }
  .ico.emo { font-size: 25px; font-weight: 400; line-height: 1; background: none !important; }
  .emo-ley { margin-right: 6px; }
  .mov .txt { flex: 1; min-width: 0; }
  .mov .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mov .s { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mov .imp { font-weight: 700; white-space: nowrap; text-align: right; }
  .mov .imp small { display: block; font-size: 12px; color: var(--reemb); font-weight: 600; }
  .mov .tachado { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .mov.previsto { opacity: .6; }
  .mov.previsto .ico { background: transparent !important; border: 1.5px dashed var(--muted); color: var(--muted) !important; }
  .imp.in { color: var(--ingreso); } .imp.re { color: var(--reemb); } .imp.tr { color: var(--traspaso); }

  /* Segmentos y recuadros */
  .seg { display: flex; background: #e7e5df; border-radius: 14px; padding: 4px; margin-top: 10px; }
  .seg button { flex: 1; padding: 9px; border-radius: 11px; font-weight: 600; color: var(--muted); font-size: 14px; }
  .seg-vista { margin: 0 0 12px; }
  .filtros { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
  .filtros::-webkit-scrollbar { display: none; }
  .filtros button { flex: none; padding: 7px 13px; border-radius: 99px; font-size: 13px; font-weight: 700; color: var(--muted); background: var(--card); box-shadow: var(--sombra); }
  .filtros button.on { background: var(--ink); color: var(--bg); }
  .fbanco { position: relative; flex: none; display: flex; align-items: center; gap: 4px; margin: 0; padding: 7px 11px 7px 13px; border-radius: 99px;
    font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--ink); background: var(--card); box-shadow: var(--sombra); }
  .fbanco.on { background: var(--ink); color: var(--bg); }
  .fbanco .flecha-sel { width: 12px; height: 12px; transform: rotate(90deg); opacity: .6; }
  .fbanco select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; padding: 0; border: 0; font-size: 16px; }
  .fsep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }
  .filtros button.pulsado { transform: scale(.93); }
  .filtros .on.f-gasto { background: #fde8e3; color: #ad4535; }
  .filtros .on.f-ingreso { background: #e4f4ea; color: #1f7444; }
  .filtros .on.f-reembolso { background: #e3ecfb; color: #2d64bd; }
  .filtros .on.f-traspaso { background: #eee6fb; color: #6b45b8; }
  :root[data-tema="oscuro"] .filtros .on.f-gasto { background: #3a1f1c; color: #f2a194; }
  :root[data-tema="oscuro"] .filtros .on.f-ingreso { background: #173323; color: #7fd9a0; }
  :root[data-tema="oscuro"] .filtros .on.f-reembolso { background: #1b2740; color: #9cc0ff; }
  :root[data-tema="oscuro"] .filtros .on.f-traspaso { background: #2a2140; color: #c9b4ff; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tres div { border-radius: 16px; padding: 10px 12px; min-width: 0; }
  .tres .ing { background: #e2f5e9; color: #2a7a4b; }
  .tres .tasa-m { display: block; font-style: normal; font-size: 11px; font-weight: 700; opacity: .75; margin-top: 1px; white-space: nowrap; }
  .tres .gas { background: #fde6e6; color: #b8434a; }
  .tres .aho { background: #e5e8fd; color: #3d48a8; }
  .tres small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; opacity: .75; text-transform: uppercase; }
  .tres b { font-size: 16px; font-weight: 700; white-space: nowrap; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--verde-pill); color: var(--verde); font-weight: 700;
    font-size: 13px; padding: 6px 10px 6px 12px; border-radius: 99px; margin-bottom: 10px; }

  /* Calendario (minimalista: círculos de color según el gasto variable y un punto si hay movimientos) */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; }
  .cal .dsem { text-align: center; font-size: 10px; font-weight: 600; color: var(--muted); opacity: .75; padding: 0 0 2px; }
  .dia { height: 37px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    font-weight: 600; font-size: 14px; position: relative; cursor: pointer; }
  .dia.fuera { visibility: hidden; }
  .dia::before { content: ''; position: absolute; top: 1px; left: 0; right: 0; margin: 0 auto; width: 29px; height: 29px; border-radius: 50%; background: var(--tono, transparent); z-index: 0; }
  .dia > * { position: relative; z-index: 1; }
  .dia .n { height: 31px; display: grid; place-items: center; font-size: 13px; }
  .dia.futuro { color: #b6b9be; }
  .dia.hoy .n { color: var(--verde); font-weight: 800; }
  .dia.sel::after { content: ''; position: absolute; top: 1px; left: 0; right: 0; margin: 0 auto; width: 29px; height: 29px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink); z-index: 2; pointer-events: none; }
  .puntos { display: flex; gap: 2px; margin-top: 0; align-items: center; height: 4px; }
  .puntos i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); opacity: .55; }
  .puntos i.prev { background: transparent; border: 1px solid var(--muted); width: 5px; height: 5px; }
  .cal-card { padding: 8px 8px 6px; margin-top: 10px; }
  .leyenda { text-align: center; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .dia-cab { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 4px 0; }
  .dia-cab h4 { margin: 0; font-size: 16px; font-weight: 700; }
  .dia-cab span { color: var(--muted); font-weight: 600; font-size: 14px; }
  .grupo { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin: 16px 0 2px; }
  .grupo:first-child { margin-top: 4px; }
  .buscar { display: flex; gap: 8px; align-items: center; background: var(--card); border-radius: 14px; padding: 4px 4px 4px 12px; box-shadow: var(--sombra); margin-top: 10px; }
  .buscar input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 16px; background: none; padding: 8px 0; }

  /* Patrimonio */
  .patri { background: var(--verde-suave); border-radius: 26px; padding: 14px 14px 0; overflow: hidden; margin-top: 10px; }
  .periodos { display: flex; align-items: center; gap: 2px; justify-content: center; }
  .periodos button { padding: 6px 9px; border-radius: 10px; font-size: 13px; font-weight: 600; color: #5d6b63; }
  .periodos button.on { background: rgba(255,255,255,.75); color: var(--ink); }
  .periodos .ojo { margin-left: 4px; color: #5d6b63; }
  .periodos .ojo svg { width: 20px; height: 20px; display: block; }
  .patri .lbl { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #5d6b63; margin-top: 14px; }
  .patri .grande { text-align: center; font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
  .patri .var { text-align: center; font-size: 14px; font-weight: 700; color: var(--verde); margin-top: 2px; }
  .patri .var.baja { color: #c4581b; }
  .grafico { position: relative; margin: 10px -14px 0; touch-action: pan-y; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  .patri svg.linea { display: block; width: 100%; height: 130px; }
  .grafico .cursor { position: absolute; top: 4px; bottom: 0; width: 1.5px; margin-left: -.75px; background: rgba(20, 83, 47, .45); opacity: 0; pointer-events: none; }
  .patri svg .trazo { stroke: var(--linea); } .patri:not(.prevg) svg circle { fill: var(--linea); }
  .grafico .punto { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--linea); border: 3px solid var(--card);
    box-shadow: 0 2px 8px rgba(20, 83, 47, .35); transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
  .grafico.activo .cursor, .grafico.activo .punto { opacity: 1; }
  .grafico.activo svg circle { visibility: hidden; }
  .patri .var.fecha { color: #3f5247; }
  .patri .pgrid { stroke: var(--linea); stroke-opacity: .16; stroke-width: 1; stroke-dasharray: 2 4; vector-effect: non-scaling-stroke; }
  .patri .peje { position: absolute; right: 10px; transform: translateY(-115%); font-size: 10px; font-weight: 600; color: var(--linea); opacity: .6;
    font-variant-numeric: tabular-nums; pointer-events: none; }
  .pfechas { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; color: var(--linea); opacity: .6; padding: 4px 0 10px; }

  /* Respuesta visual al pulsar */
  button, .mov, .dia, .cuenta .txt, .cuenta .imp, .mes b { transition: transform .18s cubic-bezier(.34,1.56,.64,1), background-color .15s, opacity .15s; }
  .ibtn.pulsado, .mes button.pulsado, .btn.pulsado, .chip.pulsado, .opcion.pulsado, .vertodos.pulsado, .periodos button.pulsado, .aviso-sb.pulsado { transform: scale(.93); }
  .seg button.pulsado, .temas button.pulsado { transform: scale(.95); }
  .ibtn.pulsado { background: #ecebe6; }
  .btn.pri.pulsado { background: #3f9e6a; }
  .btn.sec.pulsado, .opcion.pulsado { background: #e6e4de; }
  .mov.pulsado { background: #f4f3ef; border-radius: 14px; transform: scale(.985); }
  .dia.pulsado { transform: scale(.9); }
  .cuenta .txt.pulsado, .cuenta .imp.pulsado { opacity: .6; }
  .mes b.pulsado { transform: scale(.95); }
  .cuenta { display: flex; align-items: center; gap: 12px; padding: 12px 0; background: var(--card); }
  .cuenta + .cuenta { border-top: 1px solid var(--line); }
  .cuenta .logo { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; overflow: hidden;
    color: #fff; font-weight: 800; font-size: 18px; }
  .cuenta .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .cuenta .txt { flex: 1; min-width: 0; cursor: pointer; }
  .cuenta .t { font-weight: 700; }
  .cuenta .s { color: var(--muted); font-size: 13px; }
  .cuenta .imp { font-weight: 700; cursor: pointer; }
  .asa { width: 34px; height: 40px; display: grid; place-items: center; color: #b4b7bc; touch-action: none; cursor: grab; }
  .asa svg { width: 20px; height: 20px; }
  .cuenta.arrastrando { position: relative; z-index: 3; box-shadow: 0 8px 24px rgba(0,0,0,.12); border-radius: 14px; }

  /* Barra inferior */
  /* Efecto cristal (inspirado en Liquid Glass): fondo translúcido, desenfoque y brillos en los bordes */
  .barra { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(2px, calc(env(safe-area-inset-bottom) - 3px)); z-index: 20;
    display: flex; align-items: center; gap: 4px; border-radius: 99px; padding: 6px; width: min(calc(100% - 28px), 420px); justify-content: space-between;
    background: linear-gradient(180deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,.16) 100%);
    backdrop-filter: blur(5px) saturate(170%); -webkit-backdrop-filter: blur(5px) saturate(170%);
    border: 1px solid rgba(255,255,255,.6);
    box-shadow: 0 10px 30px rgba(20, 24, 28, .12), 0 1px 4px rgba(20, 24, 28, .05), inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 2px rgba(255,255,255,.35); }
  .tab { position: relative; z-index: 1; height: 48px; width: 60px; border-radius: 99px; display: flex; align-items: center; justify-content: center; color: #6f747b;
    transition: color .3s, transform .25s cubic-bezier(.34,1.56,.64,1); }
  .tab svg { width: 22px; height: 22px; flex: none; }
  .tab span { display: none; }
  .tab.pulsado { transform: scale(.86); }
  .tab.on { color: var(--verde); }
  .tab.on svg { transform: scale(1.08); transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
  .lente { position: absolute; top: 6px; height: 48px; width: 60px; border-radius: 99px; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.55), rgba(255,255,255,.12) 55%, rgba(255,255,255,.04));
    -webkit-backdrop-filter: blur(1.5px) saturate(1.8) brightness(1.06); backdrop-filter: blur(1.5px) saturate(1.8) brightness(1.06);
    box-shadow: inset 0 1.5px 1px rgba(255,255,255,.95), inset 0 -1.5px 2px rgba(255,255,255,.55), inset 0 0 0 .5px rgba(255,255,255,.7),
      inset 0 -6px 10px rgba(0,0,0,.03), 0 3px 10px rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.07);
    transition: left .5s cubic-bezier(.34,1.45,.55,1), transform .5s cubic-bezier(.34,1.45,.55,1); }
  .lente.estira { transform: scaleX(1.18) scaleY(.92); }
  .mas { position: relative; z-index: 1; width: 56px; height: 56px; border-radius: 50%; color: #fff; display: grid; place-items: center; flex: none; margin: -6px 0;
    background: #4fb57e; box-shadow: 0 6px 16px rgba(60, 160, 105, .32);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  .mas.pulsado { transform: scale(.88) rotate(90deg); }
  .mas svg { width: 26px; height: 26px; }

  /* Animaciones de entrada */
  @keyframes subir { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes crecer { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes dibujar { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
  @keyframes hojaSube { from { transform: translateY(100%); } to { transform: none; } }

// ── Utilidades ───────────────────────────────────────────
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const PALETA = ['#3a6df0','#e0473c','#1d8a4b','#f0a030','#8b5cf6','#0ea5b7','#e0559a','#7cb518','#f26b1d','#5b6b7a','#14a38b','#a855f7','#d4a20b'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const claveMes = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const desdeYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const fmt = (n, signo) => {
  const t = Math.abs(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  if (signo && n > 0.004) return '+' + t;
  if (signo && n < -0.004) return '−' + t;
  return (n < -0.004 ? '−' : '') + t;
};
// Importe que se anima contando al entrar en la pestaña
const N = (v, pre) => `<span class="cnt" data-v="${v}" data-pre="${pre || ''}">${pre || ''}${fmt(v)}</span>`;
const fechaCorta = s => { const d = desdeYmd(s); return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3); };
const fechaLarga = s => { const d = desdeYmd(s); return cap(DIAS[d.getDay()]) + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const sinAc = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function guardar(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

// ── Estado ───────────────────────────────────────────────
// Tres formas de funcionar: dentro de Google (Apps Script), instalada como app (GitHub Pages) o demostración (archivo local)
const GAS = typeof google !== 'undefined' && !!google.script;
const DEMO = !GAS && (location.protocol === 'file:' || /[?&]demo\b/.test(location.search));
const INSTALADA = !GAS && !DEMO;
let API_URL = leer('sums_api');
// Si el enlace trae ?k=CLAVE&u=Nombre, se usan y se guardan
let PARAMS = {}; try { PARAMS = JSON.parse(document.getElementById('params').textContent); } catch (e) {}
if (PARAMS.k) guardar('fin_token', PARAMS.k);
if (PARAMS.u) guardar('sums_usuario', PARAMS.u);
let TOKEN = PARAMS.k || leer('fin_token');
let USUARIO = PARAMS.u || leer('sums_usuario');
let D = { movs: [], cuentas: [], recurrentes: [], config: { categorias: { Gasto: {}, Ingreso: {} }, metodos: [], personas: [], fijos: [] } };
let FIJOS = new Set();
const hoy = new Date(); const HOY = ymd(hoy);
let mesSel = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
let tipoFiltro = null, catFiltro = null, fvFiltro = null;
let tab = 'inicio', vistaMovs = leer('sums_vista') || 'calendario', diaSel = HOY, bancoFiltro = null, busqueda = null;
let periodo = leer('sums_periodo') || 'Todo', ocultar = leer('sums_ocultar') === '1';
let form = null;

async function api(fn, ...args) {
  if (DEMO) return Promise.resolve(demoApi(fn, ...args));
  if (INSTALADA) {
    if (!API_URL) throw new Error('Falta el enlace de la hoja');
    let r;
    try { r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: fn, token: TOKEN, args }) }); }
    catch (e) { throw new Error('Sin conexión'); }
    let j; try { j = await r.json(); } catch (e) { throw new Error('La hoja no responde. ¿Has publicado la nueva versión del código?'); }
    if (!j.ok) throw new Error(String(j.mensaje || 'Error').replace(/^⚠️\s*/, ''));
    return j.datos;
  }
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](TOKEN, ...args));
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200);
}
function pantalla(id) {
  ['#cargando', '#login', '#quien', '#app', '#barra'].forEach(s => $(s).classList.add('oculto'));
  if (id === 'app') { $('#app').classList.remove('oculto'); $('#barra').classList.remove('oculto'); }
  else $('#' + id).classList.remove('oculto');
}

async function cargar() {
  if ((!TOKEN || (INSTALADA && !API_URL)) && !DEMO) { prepararLogin(); pantalla('login'); return; }
  const copia = leerCopia();
  let mostrada = false;
  if (copia && USUARIO && copia.D.config.personas.indexOf(USUARIO) > -1) {      // abre al instante con lo último guardado
    D = conPendientes(JSON.parse(JSON.stringify(copia.D))); FIJOS = new Set(D.config.fijos || []);
    pantalla('app'); pintar(true); mostrada = true; avisoRed();
  }
  try {
    if (INSTALADA) await enviarPendientes();
    const nuevo = await api('api_datos');
    const cambia = !copia || PEND.length || JSON.stringify(nuevo) !== JSON.stringify(copia.D);
    guardarCopia(nuevo); D = conPendientes(nuevo); OFFLINE = null; avisoRed();
    FIJOS = new Set(D.config.fijos || []); ultimaCarga = Date.now();
    if (!USUARIO || D.config.personas.indexOf(USUARIO) < 0) { pedirUsuario(); return; }
    if (!mostrada) { pantalla('app'); pintar(true); }
    else if (cambia) { const v = $('#velo'); if (v.classList.contains('oculto') || v.classList.contains('cierra')) pintar(); }
  } catch (e) {
    if (e.message === SIN_RED && copia) {
      OFFLINE = copia.t; avisoRed(); ultimaCarga = Date.now();
      if (!mostrada) { D = conPendientes(JSON.parse(JSON.stringify(copia.D))); FIJOS = new Set(D.config.fijos || []); if (!USUARIO) { pedirUsuario(); return; } pantalla('app'); pintar(true); }
      return;
    }
    if (/clave/i.test(e.message)) {
      TOKEN = null; guardar('fin_token', null); prepararLogin(); pantalla('login'); $('#loginError').textContent = 'Clave incorrecta';
    } else if (INSTALADA && !D.movs.length) {
      prepararLogin(); pantalla('login'); $('#loginError').textContent = e.message;
    } else { pantalla('app'); pintar(); toast('Error: ' + e.message); }
  }
}
let ultimaCarga = Date.now();
async function recargar() {
  try {
    await enviarPendientes();
    const n = await api('api_datos'); guardarCopia(n); D = conPendientes(n); OFFLINE = null;
  } catch (e) {
    if (e.message !== SIN_RED) throw e;
    OFFLINE = OFFLINE || (leerCopia() || {}).t || Date.now(); D = conPendientes(D);
  }
  FIJOS = new Set(D.config.fijos || []); ultimaCarga = Date.now(); avisoRed();
  const v = $('#velo'); if (v.classList.contains('oculto') || v.classList.contains('cierra')) pintar();
}

// ── Sin conexión ─────────────────────────────────────────
// La app guarda en el móvil una copia de los últimos datos para poder abrirse sin cobertura,
// y los movimientos añadidos sin conexión quedan pendientes hasta que se puedan enviar a la hoja.
const SIN_RED = 'Sin conexión';
let OFFLINE = null, ENVIANDO = false;
let PEND = (() => { try { return JSON.parse(leer('sums_pendientes')) || []; } catch (e) { return []; } })();
const guardarPend = () => guardar('sums_pendientes', PEND.length ? JSON.stringify(PEND) : null);
function guardarCopia(datos) {
  if (!INSTALADA) return;
  try { localStorage.setItem('sums_datos', JSON.stringify({ t: Date.now(), D: datos })); }
  catch (e) { try { localStorage.setItem('sums_datos', JSON.stringify({ t: Date.now(), D: Object.assign({}, datos, { cuentas: datos.cuentas.map(c => Object.assign({}, c, { logo: '' })) }) })); } catch (e2) {} }
}
function leerCopia() { if (!INSTALADA) return null; try { const c = JSON.parse(leer('sums_datos')); return c && c.D && c.D.movs ? c : null; } catch (e) { return null; } }
const numImporte = v => { let t = String(v == null ? '' : v).replace(/[^\d,.\-]/g, ''); if (t.indexOf(',') > -1) t = t.replace(/\./g, '').replace(',', '.'); return Math.abs(parseFloat(t)); };
function movDePendiente(p) {
  const d = p.d, h = new Date(p.t), tr = d.tipo === 'Traspaso';
  return { id: p.id, pendiente: true, fecha: d.fecha || HOY, hora: pad(h.getHours()) + ':' + pad(h.getMinutes()), importe: numImporte(d.importe), tipo: d.tipo,
    concepto: d.concepto || (tr ? `Traspaso ${d.metodo} → ${d.destino}` : (d.detalle || d.subcategoria || d.categoria || 'Sin concepto')),
    categoria: tr ? 'Traspaso' : (d.categoria || 'Sin clasificar'), subcategoria: d.subcategoria || '', detalle: d.detalle || '', metodo: d.metodo || '',
    quien: d.quien || '', notas: d.notas || '', vinculado: d.vinculado || '', destino: d.destino || '', origen: 'App' };
}
function conPendientes(datos) { datos.movs = datos.movs.filter(m => !m.pendiente).concat(PEND.map(movDePendiente)); return datos; }
async function enviarPendientes() {
  if (!PEND.length || ENVIANDO) return;
  ENVIANDO = true; let n = 0;
  try {
    while (PEND.length) {
      try { await api('api_agregar', PEND[0].d); }
      catch (e) {
        if (e.message === SIN_RED) throw e;
        toast('No se pudo guardar «' + movDePendiente(PEND[0]).concepto + '»: ' + e.message);   // error de la hoja: se descarta para no bloquear la cola
      }
      PEND.shift(); guardarPend(); n++;
    }
  } finally {
    ENVIANDO = false; avisoRed();
    if (n) toast(n === 1 ? 'Movimiento pendiente enviado' : n + ' movimientos pendientes enviados');
  }
}
function avisoRed() {
  const el = $('#avisoRed'), n = PEND.length, ver = INSTALADA && (OFFLINE !== null || n > 0);
  el.classList.toggle('oculto', !ver); document.body.classList.toggle('con-aviso', ver);
  if (!ver) return;
  const hora = OFFLINE ? new Date(OFFLINE) : null;
  const cuando = hora ? (ymd(hora) === HOY ? `de las ${pad(hora.getHours())}:${pad(hora.getMinutes())}` : `del ${hora.getDate()}/${hora.getMonth() + 1}`) : '';
  el.innerHTML = (OFFLINE !== null ? `Sin conexión · datos ${cuando}` : 'Enviando…') + (n ? ` · <b>${n} pendiente${n === 1 ? '' : 's'}</b>` : '');
}
$('#avisoRed').addEventListener('click', () => { toast('Reintentando…'); recargar().then(() => toast(OFFLINE === null ? 'Datos actualizados' : 'Sigue sin conexión')).catch(e => toast(e.message)); });
window.addEventListener('online', () => { if (INSTALADA && TOKEN) recargar().catch(() => {}); });
// Vuelve a pedir los datos al volver a la app o al cambiar de pestaña (si han pasado más de 15 s)
function refrescarSiToca() { if (TOKEN || DEMO) if (Date.now() - ultimaCarga > 15000 && !$('#app').classList.contains('oculto')) recargar().catch(() => {}); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refrescarSiToca(); });
window.addEventListener('pageshow', refrescarSiToca);

function pedirUsuario() {
  $('#quienOpciones').innerHTML = D.config.personas.map(p => `<button class="opcion" data-p="${esc(p)}">${esc(p)}</button>`).join('');
  pantalla('quien');
}
$('#quienOpciones').addEventListener('click', e => {
  const p = e.target.closest('[data-p]'); if (!p) return;
  USUARIO = p.dataset.p; guardar('sums_usuario', USUARIO); pantalla('app'); pintar(true);
});
// En la app instalada se pega el enlace que se usaba antes (…/exec?k=CLAVE&u=María): de ahí salen la dirección, la clave y el usuario
function prepararLogin() {
  if (!INSTALADA) return;
  $('#loginEnlace').classList.remove('oculto');
  $('#loginTxt').textContent = 'Pega el enlace de tu hoja (el que usabas para abrir SUMS)';
  if (API_URL) $('#loginEnlace').value = API_URL;
}
function leerEnlace(txt) {
  const m = String(txt).match(/https:\/\/script\.google\.com\/[^\s?#]+\/exec[^\s]*/);
  if (!m) return null;
  const u = new URL(m[0]);
  return { api: u.origin + u.pathname, k: u.searchParams.get('k') || '', u: u.searchParams.get('u') || '' };
}
$('#loginEnlace').addEventListener('input', e => {
  const l = leerEnlace(e.target.value);
  if (l && l.k) $('#loginToken').value = l.k;
});
$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  if (INSTALADA) {
    const l = leerEnlace($('#loginEnlace').value);
    if (!l) { $('#loginError').textContent = 'Ese enlace no parece el de tu hoja (debe empezar por https://script.google.com/… y terminar en /exec)'; return; }
    API_URL = l.api; guardar('sums_api', API_URL);
    if (l.u) { USUARIO = l.u; guardar('sums_usuario', USUARIO); }
  }
  TOKEN = $('#loginToken').value.trim(); if (!TOKEN) { $('#loginError').textContent = 'Falta la clave'; return; }
  guardar('fin_token', TOKEN); $('#loginError').textContent = ''; pantalla('cargando'); cargar();
});

// ── Cálculos ─────────────────────────────────────────────
const esFijo = m => FIJOS.has([m.categoria, m.subcategoria, m.detalle].join('|')) ||
  FIJOS.has([m.categoria, m.subcategoria, ''].join('|')) || FIJOS.has([m.categoria, '', ''].join('|'));
const filtrados = () => !bancoFiltro ? D.movs : bancoFiltro === SIN_BANCO ? sinBanco()
  : D.movs.filter(m => bancoDe(m.metodo) === bancoFiltro || bancoDe(m.destino) === bancoFiltro);
const SIN_BANCO = 'Sin banco';
const delMes = (arr, d) => arr.filter(m => m.fecha.slice(0, 7) === claveMes(d));
function resumen(arr) {
  let ing = 0, gas = 0, ree = 0;

}

let GRAF = null;

}
function activarGrafico() {
  const g = $('#grafico'); if (!g || !GRAF) return;

  const mostrar = ev => {
    const r = g.getBoundingClientRect(), n = GRAF.vent.length;

  };

    grande.querySelectorAll('.cnt').forEach(e => e.textContent = e.dataset.pre + fmt(parseFloat(e.dataset.v))); vr.querySelectorAll('.cnt').forEach(e => e.textContent = e.dataset.pre + fmt(parseFloat(e.dataset.v))); };

}

function vPatri() {
  const serie = seriePatrimonio();

  const vent = serie.slice(Math.max(0, serie.length - dias - 1));

  const dif = ult - pri, pct = pri ? dif / Math.abs(pri) * 100 : 0;

    const d = curvaSuave(pts);
    const lp = pts[pts.length - 1];
    svg = `<svg class="linea" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">
      <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb57e" stop-opacity=".25"/><stop offset="1" stop-color="#1d8a4b" stop-opacity="0"/></linearGradient></defs>
      <path class="area" d="${d} L${W} ${Hh} L0 ${Hh} Z" fill="url(#gr)"/><path class="trazo" pathLength="1" d="${d}" fill="none" stroke="var(--linea)" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="${lp[0] - 3}" cy="${lp[1]}" r="4" fill="var(--linea)"/></svg>`;
    GRAF = { vent, pts: pts.map(p => [p[0] / W, p[1]]), pri };
    // Ejes minimalistas: 3 líneas de referencia con su valor a la derecha y fechas debajo
    const paso = techo(srg / 3), ticks = [];

    const yv = v => 18 + (1 - (v - smn) / srg) * (Hh - 36);

    svg = svg.replace('<path class="area"', rejilla + '<path class="area"');
    const etiq = ocultar ? '' : ticks.map(v => `<span class="peje" style="top:${yv(v).toFixed(1)}px">${fK(v)}</span>`).join('');
    const largo = (desdeYmd(vent[vent.length - 1].f) - desdeYmd(vent[0].f)) / 864e5 > 200;
    const fe = f => { const d = desdeYmd(f); return largo ? MESES[d.getMonth()].slice(0, 3) + ' ' + String(d.getFullYear()).slice(2) : d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3); };

  } else { svg = '<div style="height:40px"></div>'; GRAF = null; }

  return cabecera('Patrimonio') + `

function donutSVG(grupos, colores, tam, grosor, centro) {

      style="stroke-dasharray:${Math.max(0, len - gap).toFixed(2)} ${C.toFixed(2)};stroke-dashoffset:${(-acc).toFixed(2)};--d:${i}" data-k="${esc(k)}"/>`;

function netoPorCampo(arr, campo) {
  const o = {};
  arr.forEach(m => {
    if (m.tipo !== 'Gasto' && m.tipo !== 'Reembolso') return;
    const k = m[campo] || (campo === 'categoria' ? 'Sin clasificar' : campo === 'subcategoria' ? '(sin subcategoría)' : '(sin detalle)');
    o[k] = (o[k] || 0) + (m.tipo === 'Gasto' ? m.importe : -m.importe);
  });
  return Object.entries(o).filter(e => e[1] > 0.004).sort((a, b) => b[1] - a[1]);
}

// Escala «redonda» para los ejes (1, 2, 2.5, 5 × 10^n)
function techo(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
const fK = v => Math.abs(v) >= 1000 ? (v / 1000).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + 'k' : Math.round(v).toLocaleString('es-ES');

function barrasSVG(ms, series, opts) {
  const W = 340, H = 186, pl = 32, pr = opts.linea ? 34 : 4, pt = 8, pb = 24, n = ms.length, cw = (W - pl - pr) / n, base = H - pb, alto = base - pt;
  let mx = 1;
  ms.forEach((_, i) => { mx = Math.max(mx, opts.apilado ? series.reduce((a, s) => a + s.vals[i], 0) : Math.max(...series.map(s => Math.max(s.vals[i], s.prev && s.prev[i] || 0)))); });
  const top = techo(mx / 4) * 4, y = v => base - v / top * alto, sel = opts.sel;
  let g = '';
  for (let k = 0; k <= 4; k += 2) { const v = top * k / 4, yy = y(v).toFixed(1);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" class="${k ? 'grid' : 'grid base'}"/><text x="${pl - 6}" y="${(+yy + 3.5).toFixed(1)}" text-anchor="end" class="eje">${fK(v)}</text>`; }
  if (sel !== null && sel !== undefined) g += `<rect x="${pl + sel * cw + 1}" y="${pt}" width="${cw - 2}" height="${alto}" class="banda"/>`;
  ms.forEach((m, i) => {
    const cx = pl + i * cw + cw / 2;
    if (opts.apilado) {
      const bw = Math.min(16, cw * .38); let acc = base;
      series.forEach(s => { const h = s.vals[i] / top * alto; if (h <= 0) return;
        g += `<rect class="barra-g" x="${(cx - bw / 2).toFixed(1)}" y="${(acc - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${s.color}" style="--d:${i}"/>`; acc -= h; });
    } else {
      const bw = Math.min(9, cw * .2), gap = 2, totw = series.length * bw + (series.length - 1) * gap;
      series.forEach((s, k) => { const h = s.vals[i] / top * alto;
        if (s.prev && s.prev[i] > s.vals[i]) { const hp = s.prev[i] / top * alto;
          g += `<rect class="barra-g" x="${(cx - totw / 2 + k * (bw + gap) + .5).toFixed(1)}" y="${(base - hp + .5).toFixed(1)}" width="${(bw - 1).toFixed(1)}" height="${(hp - 1).toFixed(1)}" rx="1" fill="none" stroke="${s.colorPrev || s.color}" stroke-width="1" stroke-dasharray="2.5 2" style="--d:${i * 2 + k}"/>`; }
        g += `<rect class="barra-g" x="${(cx - totw / 2 + k * (bw + gap)).toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="1" fill="${s.color}" style="--d:${i * 2 + k}"/>`; });
    }
    g += `<text x="${cx.toFixed(1)}" y="${H - 7}" text-anchor="middle" class="eje${sel === i ? ' on' : ''}">${mesCorto(m)}</text>`;
  });
  if (opts.linea) {
    const vs = opts.linea.filter(v => v !== null);
    if (vs.length) {
      const hi = Math.max(10, Math.ceil(Math.max(...vs) / 10) * 10), lo = Math.min(0, Math.floor(Math.min(...vs) / 10) * 10), ry = v => base - (v - lo) / ((hi - lo) || 1) * alto;
      [lo, (lo + hi) / 2, hi].forEach(v => g += `<text x="${W - pr + 6}" y="${(ry(v) + 3.5).toFixed(1)}" class="eje eje-tasa">${Math.round(v)} %</text>`);
      const pts = opts.linea.map((v, i) => v === null ? null : [pl + i * cw + cw / 2, ry(v)]);
      const unir = pts.map((q, i) => i === opts.suelto ? null : q).filter(Boolean);
      const d = unir.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
      if (unir.length > 1) g += `<path class="trazo-ana" pathLength="1" d="${d}" fill="none" stroke="${C_TASA}" stroke-width="1.75" stroke-linejoin="round"/>`;
      pts.forEach((q, i) => { if (!q) return;
        if (i === opts.suelto) g += `<circle class="pto-ana" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${sel === i ? 3.4 : 2.6}" fill="var(--card)" stroke="${C_TASA}" stroke-width="1.4"/>`;
        else g += `<circle class="pto-ana" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${sel === i ? 3.6 : 2.2}" fill="${C_TASA}" ${sel === i ? 'stroke="var(--card)" stroke-width="1.5"' : ''}/>`; });
    }
  }
  ms.forEach((_, i) => g += `<rect x="${pl + i * cw}" y="0" width="${cw}" height="${H}" fill="transparent" data-col="${i}" style="cursor:pointer"/>`);
  return `<svg class="graf-ana" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

// Previsión de fin de mes. Mes actual: con los datos de hoy.
// Meses pasados: se reconstruye la previsión que se habría visto el día CORTE y se compara con lo que pasó de verdad.
const CORTE = 15;
let prevRef = new Date(hoy.getFullYear(), hoy.getMonth(), 1), GRAFP = null;
const gastoNeto = arr => arr.reduce((s, m) => s + (m.tipo === 'Gasto' ? m.importe : m.tipo === 'Reembolso' ? -m.importe : 0), 0);
const primerMes = () => D.movs.reduce((a, m) => m.fecha.slice(0, 7) < a ? m.fecha.slice(0, 7) : a, claveMes(hoy));
function prevision(ref) {
  ref = ref || hoy;
  const y = ref.getFullYear(), mo = ref.getMonth(), N = new Date(y, mo + 1, 0).getDate(), actual = claveMes(ref) === claveMes(hoy);
  const d = actual ? hoy.getDate() : Math.min(CORTE, N), corte = ymd(new Date(y, mo, d));
  const todo = delMes(D.movs, ref), mes = todo.filter(m => m.fecha <= corte);
  const r = resumen(mes), fv = netoFV(mes);
  const ritmo = fv.vari / d, varRest = ritmo * (N - d);
  // Pendientes: en el mes actual salen de Recurrentes; en meses pasados, de los recurrentes que se cobraron después del corte
  const prev = actual ? previstosMes(hoy)
    : todo.filter(m => m.origen === 'Recurrente' && m.fecha > corte).map(m => Object.assign({}, m, { previsto: true }));
  const fijosPend = prev.filter(p => p.tipo === 'Gasto'), ingPend = prev.filter(p => p.tipo === 'Ingreso');
  const pf = fijosPend.reduce((a, p) => a + p.importe, 0), pi = ingPend.reduce((a, p) => a + p.importe, 0);
  const gasFin = r.gas + varRest + pf, ingFin = r.ing + pi, ahoFin = ingFin - gasFin;
  const antes = mesesHasta(new Date(y, mo - 1, 1), 3).map(m => resumen(delMes(D.movs, m)).gas).filter(v => v > 0);
  const media = antes.length ? antes.reduce((a, b) => a + b, 0) / antes.length : null;
  // Gasto acumulado por día: real (hasta hoy o todo el mes) y previsto desde el corte
  const real = [], previsto = []; let a = 0, b = 0;
  const ultReal = actual ? d : N;
  for (let i = 1; i <= N; i++) {
    const f = ymd(new Date(y, mo, i));
    if (i <= ultReal) { a += gastoNeto(todo.filter(m => m.fecha === f)); real.push(a); }
    if (i === d) b = real[d - 1];
    if (i > d) { b += ritmo + fijosPend.filter(p => p.fecha === f).reduce((s, p) => s + p.importe, 0); previsto.push(b); }
  }
  let ant = null;
  if (actual) {
    const pm = new Date(y, mo - 1, 1), movAnt = delMes(D.movs, pm), Nant = new Date(y, mo, 0).getDate(); let c = 0;
    if (movAnt.length) { ant = []; for (let i = 1; i <= Nant; i++) { c += gastoNeto(movAnt.filter(m => m.fecha === ymd(new Date(y, mo - 1, i)))); ant.push(c); } }
  }
  const fin = actual ? null : resumen(todo);
  return { y, mo, N, d, actual, r, fv, ritmo, varRest, fijosPend, ingPend, pf, pi, gasFin, ingFin, ahoFin, media, acum: real, previsto, ant, fin, vacio: !todo.length };
}

// Gráfica de gasto acumulado con ejes, interactiva
function graficaPrev(p) {
  const W = 340, H = 150, pl = 34, pr = 10, pt = 10, pb = 22, base = H - pb, alto = base - pt, N = p.N;
  const todos = p.acum.concat(p.previsto).concat(p.ant ? p.ant.slice(0, N) : []);
  const top = techo(Math.max(1, ...todos) / 4) * 4;
  const x = i => pl + i / (N - 1) * (W - pl - pr), y = v => base - Math.max(0, v) / top * alto;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = top * k / 4, yy = y(v).toFixed(1);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" class="${k ? 'grid' : 'grid base'}"/><text x="${pl - 6}" y="${(+yy + 3.5).toFixed(1)}" text-anchor="end" class="eje">${fK(v)}</text>`; }
  [1, 8, 15, 22, N].forEach(dd => g += `<text x="${x(dd - 1).toFixed(1)}" y="${H - 6}" text-anchor="middle" class="eje">${dd}</text>`);
  // Línea vertical del día de la previsión (hoy o el día de corte)
  g += `<line x1="${x(p.d - 1).toFixed(1)}" x2="${x(p.d - 1).toFixed(1)}" y1="${pt}" y2="${base}" class="hoy-linea"/>
    <text x="${x(p.d - 1).toFixed(1)}" y="${pt - 2}" text-anchor="middle" class="eje" style="font-size:9px">${p.actual ? 'hoy' : 'día ' + p.d}</text>`;
  if (p.ant) g += `<path d="${curvaSuave(p.ant.slice(0, N).map((v, i) => [x(i), y(v)]))}" fill="none" stroke="var(--muted)" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="2 4" stroke-linecap="round"/>`;
  const pr_ = p.acum.map((v, i) => [x(i), y(v)]), lp = pr_[pr_.length - 1], dReal = curvaSuave(pr_);
  g += `<defs><linearGradient id="grPrev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c-prev)" stop-opacity=".16"/><stop offset="1" stop-color="var(--c-prev)" stop-opacity="0"/></linearGradient></defs>
    <path class="aparece-ana" d="${dReal} L${lp[0].toFixed(1)} ${base} L${pl} ${base} Z" fill="url(#grPrev)"/>`;
  if (p.previsto.length) {
    const pv = [p.acum[p.d - 1]].concat(p.previsto).map((v, i) => [x(p.d - 1 + i), y(v)]);
    g += `<path class="aparece-ana" d="${curvaSuave(pv)}" fill="none" stroke="var(--c-prev)" stroke-opacity="${p.actual ? .6 : .75}" stroke-width="1.3" stroke-dasharray="3 3" stroke-linecap="round"/>`;
    if (!p.actual) { const e = pv[pv.length - 1]; g += `<circle class="aparece-ana fin" cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3" fill="var(--card)" stroke="var(--c-prev)" stroke-width="1.5"/>`; }
  }
  g += `<path class="trazo-ana" pathLength="1" d="${dReal}" fill="none" stroke="var(--c-prev)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="aparece-ana fin" cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="3.2" fill="var(--c-prev)"/>`;
  GRAFP = { W, H, pt, base, xs: Array.from({ length: N }, (_, i) => x(i)), y, p };

    <div class="cursor"></div><div class="punto"></div><div class="punto p2"></div></div>`;

function activarGrafPrev() {
  const g = $('#grafPrev'); if (!g || !GRAFP) return;
  const grande = $('.prevg .grande'), vr = $('.prevg .var');
  const orig = { g: grande.innerHTML, v: vr.innerHTML };
  const { p, xs } = GRAFP;
  const mostrar = ev => {
    const r = g.getBoundingClientRect(), k = r.width / GRAFP.W, px = (ev.clientX - r.left) / k;
    let i = 0; xs.forEach((xx, j) => { if (Math.abs(xx - px) < Math.abs(xs[i] - px)) i = j; });
    const vReal = i < p.acum.length ? p.acum[i] : null;
    const vPrev = i >= p.d ? p.previsto[i - p.d] : (i === p.d - 1 && p.previsto.length ? p.acum[i] : null);
    g.classList.add('activo');
    const cur = g.querySelector('.cursor'); cur.style.left = xs[i] * k + 'px'; cur.style.top = GRAFP.pt * k + 'px'; cur.style.height = (GRAFP.base - GRAFP.pt) * k + 'px'; cur.style.bottom = 'auto';
    const pon = (el, v) => { if (v === null) { el.style.display = 'none'; return; } el.style.display = ''; el.style.left = xs[i] * k + 'px'; el.style.top = GRAFP.y(v) * k + 'px'; };
    const p1 = g.querySelector('.punto'), p2 = g.querySelector('.p2');
    pon(p1, vReal !== null ? vReal : vPrev); pon(p2, vReal !== null && vPrev !== null && i !== p.d - 1 ? vPrev : null);
    const fecha = `${i + 1} ${MESES[p.mo].slice(0, 3)}`;
    grande.textContent = fmt(vReal !== null ? vReal : vPrev);
    vr.className = 'var fecha';
    vr.textContent = vReal !== null && vPrev !== null && i !== p.d - 1 ? `${fecha} · real (previsto ${fmt(vPrev)})`
      : `${fecha} · ${vReal !== null ? 'real' : 'previsto'}`;
  };
  const soltar = () => { g.classList.remove('activo'); grande.innerHTML = orig.g; vr.innerHTML = orig.v; vr.className = 'var';
    grande.querySelectorAll('.cnt').forEach(e => e.textContent = e.dataset.pre + fmt(parseFloat(e.dataset.v))); };
  g.addEventListener('pointerdown', e => { g.setPointerCapture(e.pointerId); mostrar(e); });
  g.addEventListener('pointermove', e => { if (g.classList.contains('activo')) mostrar(e); });
  g.addEventListener('pointerup', soltar); g.addEventListener('pointercancel', soltar); g.addEventListener('lostpointercapture', soltar);
  bloquearScroll(g, soltar);
}

      <div class="kv tot"><span>Ingreso estimado</span><b class="num">${fmt(p.ingFin)}</b></div>

  }

      <div class="kv"><span>Gastado hasta el día ${p.d}</span><b class="num">${fmt(p.r.gas)}</b></div>

// Reordenar cuentas arrastrando las tres rayitas
function activarArrastre() {
  const cont = $('#cuentas'); if (!cont) return;
  cont.querySelectorAll('.asa').forEach(asa => {
    asa.addEventListener('pointerdown', e => {
      e.preventDefault();
      const fila = asa.closest('.cuenta'); fila.classList.add('arrastrando');
      let y0 = e.clientY;
      asa.setPointerCapture(e.pointerId);
      const mover = ev => {
        const dy = ev.clientY - y0;
        fila.style.transform = `translateY(${dy}px)`;
        const sig = fila.nextElementSibling, ant = fila.previousElementSibling;
        if (sig && dy > sig.offsetHeight / 2) { cont.insertBefore(sig, fila); y0 += sig.offsetHeight; fila.style.transform = `translateY(${ev.clientY - y0}px)`; }
        else if (ant && -dy > ant.offsetHeight / 2) { cont.insertBefore(fila, ant); y0 -= ant.offsetHeight; fila.style.transform = `translateY(${ev.clientY - y0}px)`; }
      };
      const soltar = async () => {
        asa.removeEventListener('pointermove', mover); asa.removeEventListener('pointerup', soltar); asa.removeEventListener('pointercancel', soltar);
        fila.classList.remove('arrastrando'); fila.style.transform = '';
        const orden = [...cont.querySelectorAll('.cuenta')].map(x => x.dataset.banco);
        if (orden.join('|') === D.cuentas.map(c => c.banco).join('|')) return;
        D.cuentas.sort((a, b) => orden.indexOf(a.banco) - orden.indexOf(b.banco));
        try { await api('api_ordenCuentas', orden); toast('Orden guardado'); } catch (err) { toast(err.message); }
      };
      asa.addEventListener('pointermove', mover); asa.addEventListener('pointerup', soltar); asa.addEventListener('pointercancel', soltar);
    });
  });
}

// ── Respuesta al pulsar: marca el elemento tocado y mantiene el efecto un instante ──
let PULSADO = null;
function reaplicarPulsado(raiz) {
  if (!PULSADO || performance.now() - PULSADO.t > 400) return;
  const el = raiz.querySelector(PULSADO.sel); if (!el) return;
  el.style.transition = 'none'; el.classList.add('pulsado'); void el.offsetWidth; el.style.transition = '';
  setTimeout(() => el.classList.remove('pulsado'), 120);
}
(() => {
  const SEL = '.ir-zona, button, .mov[data-id], .dia:not(.fuera), .cuenta .txt, .cuenta .imp, .vertodos';
  let actual = null, t0 = 0;
  const soltar = () => {
    if (!actual) return;
    const el = actual; actual = null;
    setTimeout(() => el.classList.remove('pulsado'), Math.max(0, 140 - (performance.now() - t0)));
  };
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest(SEL); if (!el || el.disabled) return;
    soltar(); actual = el; t0 = performance.now(); el.classList.add('pulsado');
    // Clave para reencontrar el botón si la pantalla se redibuja al pulsarlo
    const attr = ['data-ana', 'data-anaper', 'data-anameses', 'data-baja', 'data-migas', 'data-acc', 'data-dia', 'data-vista', 'data-tipof', 'data-periodo', 'data-id', 'data-tema', 'data-f', 'data-t'].find(a => el.hasAttribute(a));
    PULSADO = attr ? { sel: `[${attr}="${CSS.escape(el.getAttribute(attr))}"]`, t: t0 } : null;
  }, { passive: true });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, soltar, { passive: true }));
  document.addEventListener('scroll', soltar, { passive: true, capture: true });
  document.addEventListener('touchstart', () => {}, { passive: true });
})();
